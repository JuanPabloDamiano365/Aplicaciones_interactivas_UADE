# =====================================================================
# application.properties
# ======================
# Configuración general de la aplicación Spring Boot: nombre, base de
# datos a usar (datasource), y comportamiento de JPA/Hibernate.
# =====================================================================

spring.application.name=tppresencial_1

# ---------------------------------------------------------------------
# PERFIL POR DEFECTO: H2 (base de datos en memoria/archivo, sin instalar nada)
# ---------------------------------------------------------------------
# Se eligió H2 como base de datos por defecto para que el proyecto se pueda
# descargar y ejecutar inmediatamente (mvn spring-boot:run) sin necesidad de
# tener MySQL instalado y configurado. Los datos se guardan en un archivo
# dentro de la carpeta del proyecto (./data/tppresencial_1), por lo que NO
# se pierden al reiniciar la aplicación (a diferencia de "jdbc:h2:mem:...").
spring.datasource.url=jdbc:h2:file:./data/tppresencial_1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita la consola web de H2 para poder ver las tablas/datos desde el
# navegador en http://localhost:8080/h2-console
# JDBC URL a usar en la consola: jdbc:h2:file:./data/tppresencial_1
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------
# PERFIL ALTERNATIVO: MySQL (comentado)
# ---------------------------------------------------------------------
# Si se prefiere usar MySQL en lugar de H2: comentar las 4 propiedades de
# arriba (spring.datasource.*) y descomentar estas 4 líneas. El driver de
# MySQL ya está incluido como dependencia en el pom.xml.
#
# spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# "update": Hibernate crea/actualiza automáticamente las tablas según las
# entidades (@Entity) definidas en el código. Ideal para desarrollo/TPO.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL generado por Hibernate (útil para entender qué
# hace cada operación de los repositorios).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico de H2 para que Hibernate genere el SQL correcto
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Datos de ejemplo: al arrancar, Spring ejecuta automáticamente
# src/main/resources/data.sql (ver ese archivo) para precargar categorías y
# productos de prueba y poder probar los endpoints sin cargar datos a mano.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
