# =====================================================================
# application.properties
# ======================
# Configuración general de la aplicación Spring Boot: nombre, base de
# datos a usar (datasource), y comportamiento de JPA/Hibernate.
# =====================================================================

spring.application.name=tppresencial_1
server.port=8080

# ---------------------------------------------------------------------
# PERFIL ACTIVO: MySQL
# ---------------------------------------------------------------------
# La aplicación usa MySQL como base de datos principal. Asegurate de tener
# MySQL corriendo en localhost:3306 y de crear la base 'ecommerce_db' antes
# de arrancar la app.
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Consola H2 desactivada porque ya no se usa.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# "update": Hibernate crea/actualiza automáticamente las tablas según las
# entidades (@Entity) definidas en el código. Ideal para desarrollo/TPO.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL generado por Hibernate (útil para entender qué
# hace cada operación de los repositorios).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Con MySQL se activa la carga automática de data.sql para dejar usuarios,
# categorías y productos precargados para probar la API sin crear datos a mano.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
